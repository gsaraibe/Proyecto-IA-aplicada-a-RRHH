services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: chassist
    volumes:
      - mongodb_data:/data/db
    networks:
      - chassist-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/chassist
      JWT_SECRET: chassist-secret-key-cambiar-en-produccion-usar-cadena-larga
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      API_KEY_IA: ${API_KEY_IA:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - chassist-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - chassist-network

networks:
  chassist-network:
    driver: bridge

volumes:
  mongodb_data:
