services:
  mongodb:
    image: mongo:7
    container_name: talentstream_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpass
      MONGO_INITDB_DATABASE: talentstream
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - talentstream_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentstream_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://admin:adminpass@mongodb:27017/talentstream?authSource=admin
    ports:
      - '5000:5000'
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - talentstream_net
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentstream_frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - talentstream_net

volumes:
  mongo_data:

networks:
  talentstream_net:
    driver: bridge
